  <style>
    :root {
      --sand:      #F5F0E8;
      --teal:      #1A4A4A;
      --deep:      #0C2424;
      --charcoal:  #2C2C2C;
      --verde:     #00C292;
      --verde-dk:  #00C292;
      --wa:        #25D366;
      --f-disp:    'Cormorant Garamond', Georgia, serif;
      --f-body:    'Jost', system-ui, sans-serif;
      --ease:      cubic-bezier(0.25, 0.1, 0.25, 1);
      --nav-h:     64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    html.lenis { height: auto; }
    html.lenis-smooth { scroll-behavior: auto !important; }
    body {
      font-family: var(--f-body); color: #fff; background: var(--deep);
      overflow-x: clip; /* contiene el desborde horizontal sin romper sticky */
      -webkit-tap-highlight-color: transparent;
    }
    a, button { color: inherit; text-decoration: none; touch-action: manipulation; }
    img { max-width: 100%; display: block; }
    button { background: none; border: none; cursor: pointer; font-family: inherit; }

    /* ─── TOP BAR ────────────────────────────────────────────── */
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h); padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(12,36,36,.72);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .bar-back {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.75); transition: color .3s;
    }
    .bar-back:hover { color: var(--verde); }
    .bar-logo img { height: 50px; width: auto; display: block; filter: invert(1); }
    .lang-pill {
      display: flex; border-radius: 20px; padding: 3px;
      border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08);
    }
    .lang-btn {
      padding: 5px 13px; border-radius: 14px; font-size: 11px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; min-height: 28px;
      color: rgba(255,255,255,.6); transition: background .3s, color .3s;
    }
    .lang-btn.active { background: var(--verde-dk) !important; color: #fff !important; }

    .s-label {
      display: block; font-size: 10px; font-weight: 500;
      letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.5);
    }

    /* ─── GALERÍA HORIZONTAL INMERSIVA ───────────────────────── */
    .gal-h-section { height: 900vh; position: relative; padding: 0 !important; background: var(--deep); overflow: clip; }
    .gal-h-sticky { position: sticky; top: 0; height: 100vh; overflow: clip; display: flex; align-items: center; }
    .gal-h-header {
      position: absolute; top: calc(var(--nav-h) + 22px); left: 4vw; right: 4vw; z-index: 3;
      display: flex; justify-content: space-between; align-items: center;
    }
    .gal-h-counter { font-family: var(--f-disp); font-size: 15px; color: rgba(255,255,255,.7); letter-spacing: .2em; }
    .gal-current-mask { display: inline-block; overflow: hidden; vertical-align: bottom; }
    .gal-current { display: inline-block; }
    .gal-h-track {
      display: flex; align-items: center; gap: 5vw;
      padding: 0 8vw; will-change: transform;
    }
    .gal-h-item { flex-shrink: 0; margin: 0; position: relative; }
    .gal-h-imgwrap { overflow: hidden; border-radius: 4px; }
    /* foto completa, sin recorte ni zoom: misma altura, el ancho sale de la proporcion de cada foto */
    .gal-h-item img, .gal-h-item video {
      display: block; width: auto; max-width: none;
      height: min(62vh, calc(86vw / var(--ar, 1.5)));
      will-change: transform, filter;
    }
    .gal-h-progress {
      position: absolute; bottom: 32px; left: 4vw; right: 4vw;
      height: 1px; background: rgba(255,255,255,.15);
    }
    .gal-h-bar { height: 100%; width: 0%; background: var(--verde); box-shadow: 0 0 12px rgba(0,194,146,.6); }
    /* flechas para pasar las fotos en PC y telefono (el scroll, el arrastre y el deslizar siguen funcionando) */
    .gal-flechas { display: flex; gap: 14px; position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 3; }
    .gal-flecha { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); color: #fff; display: grid; place-items: center; cursor: default; transition: opacity .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease); }
    .gal-h-sticky.cursor-hidden .gal-flecha { cursor: default; }
    .gal-flecha:active { border-color: var(--verde); }
    @media (hover: hover) { .gal-flecha:not(:disabled):hover { border-color: var(--verde); background: rgba(0,194,146,.12); } }
    .gal-flecha:disabled { opacity: .25; cursor: default; }
    .gal-flecha svg { width: 18px; height: 18px; }
    .no-gsap .gal-flechas { display: none; }
    @media (max-width: 768px) {
      body footer { padding-bottom: 150px; } /* que los botones flotantes no tapen 'Volver' */
      .gal-h-section { height: 1150vh; } /* paseo más lento y sereno en móvil */
      .gal-h-item img, .gal-h-item video { height: min(52vh, calc(86vw / var(--ar, 1.5))); }
    }

    /* ─── CURSOR minimalista: punto verde ────────────────────── */
    .gal-cursor {
      position: fixed; top: 0; left: 0;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--verde);
      pointer-events: none; z-index: 100; opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      will-change: transform;
    }
    .gal-cursor.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .gal-cursor.grabbing { transform: translate(-50%, -50%) scale(2.2); opacity: .7; }
    /* cursor: siempre la flecha normal (pedido del usuario); el punto verde queda apagado */
    .gal-h-sticky.cursor-hidden { cursor: default; }
    .gal-cursor { display: none; }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      background: var(--deep); border-top: 1px solid rgba(255,255,255,.08);
      color: #fff; text-align: center; padding: 52px 24px;
    }
    footer img { height: 72px; width: auto; margin: 0 auto 14px; filter: invert(1); }
    footer p { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.45); }
    .foot-back {
      display: inline-block; margin-top: 22px; padding: 13px 30px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 40px;
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #fff;
      transition: background .3s, border-color .3s;
    }
    /* efectos de botones como Caraqueña Studio (sin flecha): relleno que sube con borde curvo y texto que rueda.
       El duplicado del texto es una sombra, así sobrevive al cambio de idioma */
    .foot-back { position: relative; overflow: hidden; isolation: isolate; transition: color .45s, border-color .45s, scale .25s ease; }
    .foot-back::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--verde); transform: translateY(101%); border-radius: 50% 50% 0 0; transition: transform .6s cubic-bezier(.7,0,.2,1), border-radius .6s cubic-bezier(.7,0,.2,1); }
    .foot-back:active { scale: .96; }
    .roll { display: inline-block; overflow: hidden; line-height: 1.3; vertical-align: bottom; }
    .roll > span { display: block; text-shadow: 0 1.3em currentColor; transition: transform .55s cubic-bezier(.7,0,.2,1); }
    .bar-back { position: relative; padding: 6px 0; }
    .bar-back::after { content: ""; position: absolute; left: 25px; right: 0; bottom: 0; height: 1px; background: var(--verde); transform: scaleX(0); transform-origin: right; transition: transform .45s cubic-bezier(.7,0,.2,1); }
    @media (hover: hover) {
      .foot-back:hover { border-color: var(--verde); }
      .foot-back:hover::before { transform: translateY(0); border-radius: 0; }
      .foot-back:hover .roll > span, .bar-back:hover .roll > span { transform: translateY(-1.3em); }
      .bar-back:hover::after { transform: scaleX(1); transform-origin: left; }
    }
    .foot-legal { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin: 26px 0 0; padding: 0; }
    .foot-legal a { font-size: 11.5px; letter-spacing: .04em; color: rgba(255,255,255,.6); text-decoration: underline; text-underline-offset: 3px; }

    /* ─── WHATSAPP FLOAT ─────────────────────────────────────── */
    .wa-float {
      position: fixed;
      bottom: calc(26px + env(safe-area-inset-bottom));
      right: calc(26px + env(safe-area-inset-right));
      z-index: 200; width: 54px; height: 54px; border-radius: 50%;
      background: var(--verde-dk); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 22px rgba(0,0,0,.25);
      transition: transform .35s var(--ease);
    }
    .wa-float:hover { transform: scale(1.08); }

    /* ─── INSTAGRAM FLOAT (encima del de WhatsApp) ───────────── */
    .ig-float {
      position: fixed;
      bottom: calc(96px + env(safe-area-inset-bottom));
      right: calc(26px + env(safe-area-inset-right));
      z-index: 200; width: 54px; height: 54px; border-radius: 50%;
      background: #fff; color: var(--verde-dk);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 22px rgba(0,0,0,.25);
      transition: transform .35s var(--ease);
    }
    .ig-float:hover { transform: scale(1.08); }
    /* la misma onda que en la página principal, en los dos botones */
    .wa-float::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; background: rgba(0,194,146,.3); animation: waPulse 2.6s ease-out infinite; }
    .ig-float { animation: igPulse 2.6s ease-out infinite; }
    @keyframes igPulse { 0% { box-shadow: 0 6px 22px rgba(0,0,0,.25), 0 0 0 0 rgba(0,194,146,.45); } 100% { box-shadow: 0 6px 22px rgba(0,0,0,.25), 0 0 0 22px rgba(0,194,146,0); } }
    @keyframes waPulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.65); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .wa-float::before { animation: none; opacity: 0; } .ig-float { animation: none; } }

    [data-t] { transition: opacity .22s ease; }
    /* foco visible al navegar con teclado */
    :focus-visible { outline: 2px solid var(--verde); outline-offset: 3px; }
    .switching [data-t] { opacity: 0 !important; }

    /* ─── Sin GSAP o reduced-motion: fluye en vertical ───────── */
    .no-gsap .gal-h-section { height: auto; }
    .no-gsap .gal-h-sticky { position: static; height: auto; }
    .no-gsap .gal-h-track { flex-wrap: wrap; justify-content: center; padding: 96px 8vw 64px; gap: 32px; }
    .no-gsap .gal-h-item img, .no-gsap .gal-h-item video { width: min(86vw, 560px); height: auto; }
    .no-gsap .gal-h-progress, .no-gsap .gal-cursor { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .gal-h-section { height: auto !important; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

/* el texto no se puede seleccionar (pedido del usuario); los campos de formulario si */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
  </style>
</head>

}

<script>
/* videos de la galeria: se cargan y reproducen solo cuando estan en pantalla */
(function(){
  var vids = document.querySelectorAll('.gal-h-video video');
  if (!('IntersectionObserver' in window)) { vids.forEach(function(v){ v.preload = 'auto'; v.play().catch(function(){}); }); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      var v = e.target;
      if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(function(){}); } else { v.pause(); }
    });
  }, { rootMargin: '0px 30% 0px 30%' });
  vids.forEach(function(v){ io.observe(v); });
})();
</script>

<!-- ══ GSAP + Lenis: galería inmersiva ══ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined' || reduced) {
    document.documentElement.classList.add('no-gsap');
    return;
  }
  gsap.registerPlugin(ScrollTrigger);
  /* en móvil, la barra del navegador cambia el viewport al scrollear y
     provocaba recálculos a mitad de gesto (saltos foto a foto) */
  ScrollTrigger.config({ ignoreMobileResize: true });
  var isTouch = window.matchMedia('(hover: none)').matches;

  /* Lenis smooth scroll */
  if (typeof Lenis !== 'undefined') {
    var lenis = new Lenis({ duration: 1.1, smoothWheel: true });
    window.lenis = lenis;
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(function(time){ lenis.raf(time * 1000); });
    gsap.ticker.lagSmoothing(0);
  }


  var galSection = document.querySelector('.gal-h-section');
  if (!galSection) return;
  var galTrack = galSection.querySelector('.gal-h-track');
  var galBar = galSection.querySelector('.gal-h-bar');
  var galItems = galSection.querySelectorAll('.gal-h-item');
  var galCurrent = galSection.querySelector('.gal-current');
  var galTotal = galSection.querySelector('.gal-total');
  galTotal.textContent = String(galItems.length).padStart(2, '0');

  /* Alto de la sección proporcional a la cantidad de fotos (≈54vh por foto en PC, para que cada giro de la rueda avance menos; 52vh en móvil) */
  var perItem = window.matchMedia('(max-width: 768px)').matches ? 52 : 54;
  galSection.style.height = Math.max(220, (galItems.length + 1) * perItem) + 'vh';

  /* Counter con transición: dígito sale arriba, el nuevo entra desde abajo */
  var lastCounterTxt = galCurrent.textContent;
  function setCounter(txt){
    if (txt === lastCounterTxt) return;
    lastCounterTxt = txt;
    gsap.timeline({ overwrite: true })
      .to(galCurrent, { yPercent: -110, duration: 0.15, ease: 'power2.in', overwrite: true })
      .add(function(){ galCurrent.textContent = txt; })
      .fromTo(galCurrent, { yPercent: 110 }, { yPercent: 0, duration: 0.15, ease: 'power2.out' });
  }

  var lastFocus = -1;
  /* sin zoom de recorte: la foto en foco va a su tamaño real y las demas un poco mas chicas */
  var SCALE_FOCUS = 1, SCALE_REST = 0.975;

  function updateFocus(){
    var cx = window.innerWidth / 2, best = 0, bestDist = Infinity;
    galItems.forEach(function(item, i){
      var r = item.getBoundingClientRect();
      var d = Math.abs(r.left + r.width / 2 - cx);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    if (best === lastFocus) return;
    lastFocus = best;
    galItems.forEach(function(item, i){
      gsap.to(item.querySelector('img, video'), {
        scale: i === best ? SCALE_FOCUS : SCALE_REST,
        filter: i === best ? 'brightness(1)' : 'brightness(0.9)',
        duration: 0.8, ease: 'power2.out', overwrite: 'auto'
      });
    });
  }

  var galTween = gsap.to(galTrack, {
    x: function(){ return Math.min(0, -(galTrack.scrollWidth - window.innerWidth + 120)); },
    ease: 'none',
    /* el numero es el de la foto que esta en el centro (se actualiza mientras la fila se mueve) */
    onUpdate: function(){
      var cx = window.innerWidth / 2, idx = 1, dmin = Infinity;
      galItems.forEach(function(item, i){
        var r = item.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - cx);
        if (d < dmin) { dmin = d; idx = i + 1; }
      });
      setCounter(String(idx).padStart(2, '0'));
    },
    scrollTrigger: {
      trigger: galSection,
      start: 'top top',
      end: 'bottom bottom',
      scrub: isTouch ? 0.5 : 1,
      invalidateOnRefresh: true,
      onUpdate: function(self){
        galBar.style.width = (self.progress * 100) + '%';
        if (!isTouch) updateFocus();
      }
    }
  });

  /* entrada de cada foto */
  galItems.forEach(function(item){
    /* Reveal de máscara: la imagen se descubre de derecha a izquierda al entrar */
    var wrap = item.querySelector('.gal-h-imgwrap');
    gsap.set(wrap, { clipPath: 'inset(0% 0% 0% 100%)' });
    /* las fotos que ya estan en pantalla al abrir se descubren solas, sin esperar el scroll */
    if (item.getBoundingClientRect().left < innerWidth * 1.05) {
      gsap.to(wrap, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.9, ease: 'power3.out', delay: 0.2 });
      return;
    }
    gsap.to(wrap, {
      clipPath: 'inset(0% 0% 0% 0%)', duration: 0.8, ease: 'power3.out',
      scrollTrigger: { trigger: item, containerAnimation: galTween, start: 'left 105%', once: true }
    });
  });

  /* Entrada cinematográfica de las 3 primeras imágenes */
  var first3 = Array.prototype.slice.call(galItems, 0, 3).map(function(i){ return i.querySelector('img, video'); });
  gsap.from(first3, {
    y: 60, opacity: 0, stagger: 0.15, duration: 0.9, ease: 'power3.out',
    scrollTrigger: { trigger: galSection, start: 'top 70%', once: true }
  });

  /* helpers de arrastre compartidos (desktop y touch) */
  var sticky = galSection.querySelector('.gal-h-sticky');
  function dragFactorShared(){
    return (galSection.offsetHeight - window.innerHeight) /
           Math.max(1, galTrack.scrollWidth - window.innerWidth + 120);
  }
  function scrollToYShared(y){
    if (window.lenis) { window.lenis.scrollTo(y, { immediate: true }); }
    else { window.scrollTo(0, y); }
  }

  /* Swipe horizontal en táctil: deslizar derecha↔izquierda también pasa las fotos */
  if (isTouch) {
    var tStartX = 0, tStartY = 0, tStartScroll = 0, tLastX = 0, tLastT = 0;
    var tActive = false, tHoriz = false, tVelo = 0;
    sticky.addEventListener('touchstart', function(e){
      tActive = true; tHoriz = false; tVelo = 0;
      tStartX = tLastX = e.touches[0].clientX;
      tStartY = e.touches[0].clientY;
      tStartScroll = window.scrollY;
      tLastT = performance.now();
    }, { passive: true });
    sticky.addEventListener('touchmove', function(e){
      if (!tActive) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      var dx = x - tStartX, dy = y - tStartY;
      if (!tHoriz) {
        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { tHoriz = true; }
        else if (Math.abs(dy) > 14) { tActive = false; return; } /* gesto vertical: scroll nativo */
      }
      if (tHoriz) {
        e.preventDefault();
        var now = performance.now();
        var dt = Math.max(1, now - tLastT);
        tVelo = (tLastX - x) / dt;
        tLastX = x; tLastT = now;
        scrollToYShared(tStartScroll + (tStartX - x) * dragFactorShared() * 1.35);
      }
    }, { passive: false });
    sticky.addEventListener('touchend', function(){
      if (tHoriz) {
        var v = tVelo * dragFactorShared() * 1.35 * 16;
        (function momentum(){
          if (Math.abs(v) < 0.4) return;
          scrollToYShared(window.scrollY + v);
          v *= 0.94;
          requestAnimationFrame(momentum);
        })();
      }
      tActive = false; tHoriz = false;
    }, { passive: true });
  }

  /* flechas (PC y telefono): llevan a la foto anterior o siguiente, centrada; el scroll y el deslizar siguen igual */
  var flechaAnt = galSection.querySelector('.gal-ant'), flechaSig = galSection.querySelector('.gal-sig');
  function posFoto(i){
    var st = galTween.scrollTrigger, rango = st.end - st.start;
    var maxX = Math.max(1, galTrack.scrollWidth - window.innerWidth + 120);
    var tr = galTrack.getBoundingClientRect(), x0 = tr.left - gsap.getProperty(galTrack, 'x');
    var r = galItems[i].getBoundingClientRect();
    var q = gsap.utils.clamp(0, 1, -(window.innerWidth / 2 - x0 - (r.left + r.width / 2 - tr.left)) / maxX);
    return st.start + q * rango;
  }
  function fotoActual(){
    var cx = window.innerWidth / 2, best = 0, bestDist = Infinity;
    galItems.forEach(function(item, i){
      var r = item.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - cx);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }
  var destinoFlecha = -1;
  function irA(paso){
    var base = destinoFlecha >= 0 ? destinoFlecha : fotoActual();
    var i = Math.max(0, Math.min(galItems.length - 1, base + paso));
    destinoFlecha = i;
    var y = posFoto(i);
    var listo = function(){ destinoFlecha = -1; };
    if (window.lenis) window.lenis.scrollTo(y, { duration: 0.7, onComplete: listo, easing: function(t){ return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; } });
    else { window.scrollTo({ top: y, behavior: 'smooth' }); setTimeout(listo, 700); }
  }
  function estadoFlechas(){
    var i = fotoActual();
    flechaAnt.disabled = i <= 0;
    flechaSig.disabled = i >= galItems.length - 1;
  }
  if (flechaAnt && flechaSig) {
    flechaAnt.addEventListener('click', function(){ irA(-1); });
    flechaSig.addEventListener('click', function(){ irA(1); });
    window.addEventListener('scroll', function(){ requestAnimationFrame(estadoFlechas); }, { passive: true });
    estadoFlechas();
  }

  /* Cursor drag elegante + arrastre con momentum (solo desktop) */
  if (!isTouch) {
    var cursor = document.querySelector('.gal-cursor');
    var inGal = false;

    var cMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var cPos = { x: cMouse.x, y: cMouse.y };
    window.addEventListener('mousemove', function(e){
      cMouse.x = e.clientX; cMouse.y = e.clientY;
    }, { passive: true });
    gsap.ticker.add(function(){
      cPos.x += (cMouse.x - cPos.x) * 0.15;
      cPos.y += (cMouse.y - cPos.y) * 0.15;
      cursor.style.left = cPos.x + 'px';
      cursor.style.top = cPos.y + 'px';
    });

    sticky.addEventListener('mouseenter', function(){
      inGal = true;
      cursor.classList.add('active');
      sticky.classList.add('cursor-hidden');
    });
    sticky.addEventListener('mouseleave', function(){
      inGal = false;
      cursor.classList.remove('active', 'grabbing');
      sticky.classList.remove('cursor-hidden');
    });

    /* arrastre horizontal → scroll vertical equivalente, con momentum al soltar */
    var dragging = false, startX = 0, startScroll = 0;
    var velo = 0, lastMoveX = 0, lastMoveT = 0;
    /* sobre las flechas: cursor normal, sin el cursor de arrastre */
    var flechasBox = galSection.querySelector('.gal-flechas');
    if (flechasBox) {
      flechasBox.addEventListener('mouseenter', function(){ cursor.classList.remove('active'); });
      flechasBox.addEventListener('mouseleave', function(){ if (inGal) cursor.classList.add('active'); });
    }
    sticky.addEventListener('pointerdown', function(e){
      if (!inGal || e.target.closest('.gal-flechas')) return;
      dragging = true;
      startX = e.clientX; startScroll = window.scrollY;
      velo = 0; lastMoveX = e.clientX; lastMoveT = performance.now();
      cursor.classList.add('grabbing');
    });
    window.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var now = performance.now();
      var dt = Math.max(1, now - lastMoveT);
      velo = (lastMoveX - e.clientX) / dt;
      lastMoveX = e.clientX; lastMoveT = now;
      scrollToYShared(startScroll + (startX - e.clientX) * dragFactorShared() * 0.7);
    });
    /* acomodo suave: al dejar de hacer scroll, la foto mas cercana se centra sola en medio segundo */
    var acomodoT = null;
    function acomodar(){
      var st = galTween.scrollTrigger, rango = st.end - st.start;
      if (dragging || !window.lenis || rango <= 0) return;
      var y = window.lenis.scroll, p = (y - st.start) / rango;
      if (p <= 0.001 || p >= 0.999) return;
      var maxX = Math.max(1, galTrack.scrollWidth - window.innerWidth + 120);
      var tr = galTrack.getBoundingClientRect(), x0 = tr.left - gsap.getProperty(galTrack, 'x');
      var mejor = null;
      galItems.forEach(function(item){
        var r = item.getBoundingClientRect();
        var q = gsap.utils.clamp(0, 1, -(window.innerWidth / 2 - x0 - (r.left + r.width / 2 - tr.left)) / maxX);
        if (mejor === null || Math.abs(q - p) < Math.abs(mejor - p)) mejor = q;
      });
      var destino = st.start + mejor * rango;
      if (Math.abs(destino - y) > 2) window.lenis.scrollTo(destino, { duration: 0.6, easing: function(t){ return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; } });
    }
    if (window.lenis) window.lenis.on('scroll', function(){ clearTimeout(acomodoT); acomodoT = setTimeout(acomodar, 220); });

    window.addEventListener('pointerup', function(){
      if (!dragging) return;
      dragging = false;
      cursor.classList.remove('grabbing');
      var v = velo * dragFactorShared() * 0.7 * 16;
      (function momentum(){
        if (dragging || Math.abs(v) < 0.4) return;
        scrollToYShared(window.scrollY + v);
        v *= 0.94;
        requestAnimationFrame(momentum);
      })();
    });
  }
})();
</script>
</body>
</html>
