<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Casa Verde</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root { --deep: #0C2424; --verde: #00C292; --base: #fff8ed; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: var(--deep); color: var(--base); font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
    main { max-width: 520px; }
    img { height: 72px; width: auto; filter: invert(1); margin: 0 auto 36px; display: block; }
    .n { font-size: 12px; font-weight: 600; letter-spacing: .3em; color: var(--verde); }
    h1 { margin: 14px 0 14px; font-weight: 500; font-size: clamp(30px, 7vw, 46px); line-height: 1.05; letter-spacing: -.03em; font-variation-settings: 'wdth' 125; }
    p { color: rgba(255,248,237,.72); font-size: 15px; line-height: 1.6; }
    .en { margin-top: 6px; font-size: 13px; color: rgba(255,248,237,.5); }
    a { display: inline-block; margin-top: 34px; padding: 14px 28px; border-radius: 999px; background: var(--base); color: var(--deep); text-decoration: none; font-weight: 600; font-size: 14px; transition: background .25s, color .25s; }
    a:hover, a:focus-visible { background: var(--verde); color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="Casa Verde" width="800" height="500">
    <p class="n">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <p class="en">This page doesn't exist.</p>
    <a href="/">Volver a Casa Verde</a>
  </main>
</body>
</html>
